  # ═══════════════════════════════════════════════════════════════════════════
  # HEALTH
  # ═══════════════════════════════════════════════════════════════════════════

  /health:
    get:
      tags: [health]
      summary: "Health check da API"
      description: "Verifica status da API, banco de dados e Redis. Usado pelo motor para detectar modo read-only."
      security: []
      responses:
        '200':
          description: "API operacional"
          content:
            application/json:
              schema:
                type: object
                required: [status, services]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  services:
                    type: object
                    required: [database, redis, motor]
                    properties:
                      database:
                        type: string
                        enum: [ok, error]
                      redis:
                        type: string
                        enum: [ok, error]
                      motor:
                        type: string
                        enum: [online, offline, readonly]
                  timestamp:
                    type: string
                    format: date-time
        '503':
          description: "API degradada ou indisponível"
          content:
            application/json:
              schema:
                type: object
                required: [status, services]
                properties:
                  status:
                    type: string
                    enum: [error]
                  services:
                    type: object
