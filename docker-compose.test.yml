# docker-compose.test.yml — Banco de dados ISOLADO para testes de integração
# Porta 5433 (separado do dev na 5432) para evitar conflitos.
# Uso:
#   cp .env.test.example .env.test          # so na primeira vez (.env.test e gitignored)
#   npm run test:integration:setup          # sobe os containers e aplica o schema
#   npm run test:integration
#
# O setup usa `prisma db push` contra o schema do app
# (footstock-next/prisma/schema.prisma), NAO `migrate deploy` contra o schema do
# motor: sao dois schemas diferentes e o do motor nao tem os models que as suites
# de auth, ordens e forum usam.

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: foot-stock-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: foot_stock_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # Sem volume persistente para testes — dados efêmeros
    tmpfs:
      - /var/lib/postgresql/data

  # Redis ISOLADO para testes (dev usa 6379). O harness NAO mocka `@/lib/redis`:
  # o modulo real e usado contra este container, porque metade do contrato de
  # ordens vive em Redis (`market:tick:latest`, `motor:global-halt`, rate limit
  # por sliding window em Lua). Mock feito a mao aqui ja escondeu 8 falhas.
  redis-test:
    image: redis:7-alpine
    container_name: foot-stock-redis-test
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # Sem volume persistente — dados efemeros, como o postgres-test
