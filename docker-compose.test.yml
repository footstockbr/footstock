# docker-compose.test.yml — Banco de dados ISOLADO para testes de integração
# Porta 5433 (separado do dev na 5432) para evitar conflitos.
# Uso:
#   docker compose -f docker-compose.test.yml up -d
#   DATABASE_URL=$TEST_DATABASE_URL npx prisma migrate deploy
#   npm run test:integration

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: foot-stock-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: foot_stock_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # Sem volume persistente para testes — dados efêmeros
    tmpfs:
      - /var/lib/postgresql/data

  # Redis ISOLADO para testes (dev usa 6379). O harness NAO mocka `@/lib/redis`:
  # o modulo real e usado contra este container, porque metade do contrato de
  # ordens vive em Redis (`market:tick:latest`, `motor:global-halt`, rate limit
  # por sliding window em Lua). Mock feito a mao aqui ja escondeu 8 falhas.
  redis-test:
    image: redis:7-alpine
    container_name: foot-stock-redis-test
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # Sem volume persistente — dados efemeros, como o postgres-test
