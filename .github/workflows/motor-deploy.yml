name: Motor Deploy

on:
  push:
    branches: [main]
    paths:
      - 'motor/**'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/motor-deploy.yml'
      - 'prisma/schema.prisma'
      - 'scripts/check-news-schema-drift.js'
      - 'scripts/check-ticker-parity.sh'
      - 'scripts/ticker-parity-baseline.json'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Deploy Railway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '22'

      # Guard bloqueante M067/item 010: o Dockerfile do motor gera Prisma Client a
      # partir de prisma/schema.prisma (raiz) — este deploy nao roda migrations
      # nem toca footstock-next/, mas o build do motor confia que os dois schemas
      # estao sincronizados. Um drift no model News produz perda silenciosa de
      # noticias (NewsPublisher.ts engole PrismaClientValidationError).
      - name: Guard de drift do model News (prisma/ vs footstock-next/prisma/)
        run: node scripts/check-news-schema-drift.js

      # Guard bloqueante T-12 (loop 08-18, secao 10.4): TICKERS_40 (motor) e
      # CLUBS_PUBLIC (front) sao duas listas manuais dos mesmos 40 clubes, sem
      # validacao cruzada. Um clube presente em `assets`/CLUBS_PUBLIC mas ausente
      # de TICKERS_40 e DESCARTADO pelo filtro de aceitacao do classificador
      # (normalizeCandidates), com apenas um logger.warn. O guard tambem congela a
      # paridade semantica entre ticker-fallback.ts (motor) e
      # ticker-resolver-core.ts (front), que sao copias espelhadas.
      - name: Guard de paridade de tickers (TICKERS_40 vs CLUBS_PUBLIC vs core)
        run: bash scripts/check-ticker-parity.sh

      - name: Instalar dependências motor
        working-directory: motor
        run: npm ci

      # Prisma Client precisa existir antes de typecheck:scripts (m067-client-smoke.ts
      # importa @prisma/client). Espelha o Dockerfile da raiz: schema monorepo em
      # prisma/schema.prisma (sem url no estilo Prisma 7) + generate Prisma 6.
      - name: Generate Prisma Client (schema monorepo)
        working-directory: motor
        run: |
          mkdir -p prisma
          cp ../prisma/schema.prisma prisma/schema.prisma
          if ! grep -qE '^\s*url\s*=' prisma/schema.prisma; then
            sed -i 's/provider = "postgresql"/provider = "postgresql"\n  url       = env("DATABASE_URL")\n  directUrl = env("DIRECT_URL")/' prisma/schema.prisma
          fi
          DATABASE_URL="postgresql://prisma:prisma@localhost/prisma" \
          DIRECT_URL="postgresql://prisma:prisma@localhost/prisma" \
            npx --yes prisma@^6 generate --schema=prisma/schema.prisma

      # Gate G1 / F-009-R2-03: typecheck do pacote motor + scripts (tsconfig.scripts.json)
      # DEVE falhar o pipeline antes do deploy se houver erro de tipo em motor/scripts/.
      - name: Typecheck all (motor + scripts)
        working-directory: motor
        run: npm run typecheck:all

      - name: Test gate (motor)
        working-directory: motor
        run: npm test -- --ci --silent
        env:
          NODE_ENV: test

      - name: Instalar Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy para Railway
        run: railway up --service motor --environment production --detach --ci
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: 45677912-3487-4978-b20b-fc7cdb8b93cf

      - name: Deploy summary
        run: |
          echo "### Motor deployado no Railway SHA ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
